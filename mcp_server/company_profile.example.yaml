# ============================================================
#  만다린로보틱스 회사 프로필 (적합도 평가용)
#  ※ 실제 값을 채운 파일은 공개 저장소에 올리지 마십시오.
#    복사 위치: 내 PC의  ~/.mandarin-gov/company_profile.yaml
# ============================================================

회사명: 만다린로보틱스
설립일: "YYYY-MM-DD"          # 업력 계산 기준 (창업 n년 이내 조건)
기업형태: 중소기업            # 예비창업 / 초기창업 / 중소기업 / 벤처기업
상시근로자수: 5
소재지: "시·도 시·군·구"       # 지자체 공고 지역 제한 판단용
업종:
  - 로봇 제조
  - 푸드테크
주요제품:
  - "X-WOK: 웍 조리 로봇 (모션 레시피 실행)"
  - "X-RECIPER: 소스 정량 토출 디스펜서 스테이션"
  - "CloneX Studio: 모션 레시피 저작 도구"
  - "RINDA: 조리로봇 RaaS 구독 서비스"
보유인증:                     # 해당 항목만 남기세요
  - 벤처기업
  # - 기업부설연구소
  # - 이노비즈
  # - 메인비즈
지식재산: []                  # 특허·상표 보유 현황 (예: "특허 등록 2건")
관심분야:
  - 로봇 실증·보급
  - 외식업 자동화
  - 해외진출 (베트남·인도네시아)
  - R&D 과제
제외조건:                     # 지원하지 않을 유형
  - 예비창업자 전용
기수혜이력: []                # 중복수혜 제한 확인용 (예: "2025 초기창업패키지")
메모: ""
