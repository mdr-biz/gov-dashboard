dashboard_title: "만다린 정부지원사업 대시보드"
highlight_days: 3
max_archive: 500

# ============================================================
#  데이터 소스
#  ─ API 소스(안정적): bizinfo, kstartup, mss, msit
#     → 공공데이터포털 인증키(DATAGO_KEY) 하나로 작동
#     → bizinfo만 별도 키(BIZINFO_KEY) 사용
#  ─ HTML 소스(보조): 나머지. 사이트 구조 바뀌면 깨질 수 있음
# ============================================================
sources:
  # ---------- API 소스 (핵심, 안정적) ----------
  - id: bizinfo
    name: 기업마당
    tier: 1
    enabled: true
  - id: kstartup
    name: K-Startup
    tier: 1
    enabled: true
  - id: mss
    name: 중소벤처기업부
    tier: 1
    enabled: true
  - id: msit
    name: 과학기술정보통신부
    tier: 2
    enabled: true

  # ---------- HTML 소스 (보조) ----------
  # 아래는 각 사이트 구조에 따라 작동이 불안정할 수 있습니다.
  # 첫 실행 후 0건이 계속되면 enabled: false 로 끄셔도 됩니다.
  - id: kiria
    name: 한국로봇산업진흥원
